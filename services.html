<div class="ambient a1"></div><div class="ambient a2"></div>

 <div id="servicesGrid" class="grid3"></div>
 <div class="form-card top-gap">

   <input name="name" required placeholder="الاسم">
   <input name="email" type="email" required placeholder="البريد">

   <input name="budget" placeholder="الميزانية التقريبية (اختياري)">

   <button class="btn primary" type="submit">إرسال الطلب</button>
  </form><div class="form-status" id="serviceStatus"></div>
 </div>
