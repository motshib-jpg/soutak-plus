name: Pillar Survival Closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pillar-survival-closure.yml'
      - 'tools/pillar_survival_closure.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pillar closure
        run: python3 tools/pillar_survival_closure.py
      - name: Validate
        run: python3 QA_CHECK.py
      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soutak-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Close pillar content and discoverability survival risks"
          git push
