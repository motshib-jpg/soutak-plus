name: One-time contact final polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/contact-final.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('contact.html')
          html=p.read_text(encoding='utf-8')
          extra='''<section class="section pt0"><div class="container"><div class="trust-box"><h2>ما الذي يساعدنا على الرد بوضوح؟</h2><p>اكتب رسالة واحدة تجمع المشكلة والسياق والنتيجة التي تريد الوصول إليها. تجنب إرسال معلومات شخصية لا يحتاجها الطلب، وإذا كانت الملاحظة تقنية فاذكر نوع الجهاز أو المتصفح عند الحاجة فقط. كلما كانت الرسالة محددة، كان من الأسهل توجيهها للمسار الصحيح ومراجعتها دون تأخير أو تخمين.</p></div></div></section>'''
          if extra not in html:
              html=html.replace('</main>',extra+'</main>',1)
          p.write_text(html,encoding='utf-8')
          Path('.github/workflows/contact-final.yml').unlink(missing_ok=True)
          PY
          git config user.name "soutak-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clear final contact audit threshold" || true
          git push origin HEAD:main
