name: Validate SoutakPlus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production site and security invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vercel.json
          test -f account.html
          test -f admin.html
          test -f login.html
          test -f assets/js/account.js
          test -f assets/js/admin.js
          test -f assets/js/forms.js
          test -f assets/js/reward-gate.js
          test -f assets/js/rewarded-ads.js
          test -f supabase/functions/soutak-reward/index.ts
          test -f supabase/functions/soutak-public-submit/index.ts

          # Protected resources must never be shipped as public files.
          test ! -f downloads/creator-starter-guide.md
          test ! -f downloads/content-templates.md
          test ! -f downloads/first-audience-roadmap.md
          test ! -f database/schema.sql

          # Reward policy and server-bound access.
          grep -q '"creator-starter-guide":5' assets/js/store.js
          grep -q '"content-templates":5' assets/js/store.js
          grep -q '"first-audience":10' assets/js/store.js
          grep -q 'rewardedSlotGranted' assets/js/rewarded-ads.js
          grep -q 'functions/v1/soutak-reward' assets/js/reward-gate.js
          if grep -q 'localStorage' assets/js/reward-gate.js; then
            echo 'Client-side entitlement detected.' >&2
            exit 1
          fi

          # Public writes must use the hardened Edge Function, not direct public RPCs.
          grep -q 'functions/v1/soutak-public-submit' assets/js/forms.js
          if grep -Eq 'soutak_submit_(sponsor|service|contact)_.*public|soutak_subscribe_public' assets/js/forms.js; then
            echo 'Legacy public write RPC detected.' >&2
            exit 1
          fi

          # Admin access must require Supabase admin authorization and MFA/AAL2.
          grep -q 'soutak_is_admin' assets/js/admin.js
          grep -q 'aal2' assets/js/admin.js
          grep -q 'mfa' assets/js/admin.js

          # Browser hardening must remain in place.
          grep -q "script-src-attr 'none'" vercel.json
          grep -q 'Strict-Transport-Security' vercel.json
          grep -q 'X-Frame-Options' vercel.json
          grep -q 'no-store' vercel.json
          grep -q 'Disallow: /admin.html' robots.txt
          grep -q 'Disallow: /product.html' robots.txt
          grep -q 'soutak-plus.vercel.app' sitemap.xml

          # Never commit secret-looking Supabase server keys.
          if grep -R -n -E 'sb_secret_[A-Za-z0-9_-]{12,}|service_role["'"'[:space:]]*[:=]["'"'][A-Za-z0-9._-]{20,}' --exclude-dir=.git .; then
            echo 'Potential server secret committed.' >&2
            exit 1
          fi

          if grep -R -n -E 'YOUR-DOMAIN\.example|motshib-jpg\.github\.io/soutak-plus|وضع تجريبي|نسخة تجريبية' --include='*.html' --include='*.js' --include='robots.txt' --include='sitemap.xml' .; then
            echo 'Production placeholder or demo text found.' >&2
            exit 1
          fi

          python3 QA_CHECK.py
