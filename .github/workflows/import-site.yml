name: Deploy SoutakPlus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site and fixed Rewarded Ads rules
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/store.js
          test -f assets/js/reward-gate.js
          test -f assets/js/rewarded-ads.js
          test -s downloads/creator-starter-guide.md
          test -s downloads/content-templates.md
          test -s downloads/first-audience-roadmap.md
          grep -Fq '"creator-starter-guide":5' <(tr -d ' ' < assets/js/store.js)
          grep -Fq '"content-templates":5' <(tr -d ' ' < assets/js/store.js)
          grep -Fq '"first-audience":10' <(tr -d ' ' < assets/js/store.js)
          grep -Fq '"creator-starter-guide":5' <(tr -d ' ' < assets/js/reward-gate.js)
          grep -Fq '"content-templates":5' <(tr -d ' ' < assets/js/reward-gate.js)
          grep -Fq '"first-audience":10' <(tr -d ' ' < assets/js/reward-gate.js)
          grep -q 'rewardedSlotGranted' assets/js/rewarded-ads.js
          test "$(grep -c 'reward_ads_required: 5' assets/js/demo-data.js)" -eq 2
          test "$(grep -c 'reward_ads_required: 10' assets/js/demo-data.js)" -eq 1
          test ! -f checkout.html
          test ! -f payment.html
          test ! -f subscription.html
          python3 QA_CHECK.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
