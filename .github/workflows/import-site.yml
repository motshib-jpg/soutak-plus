name: Validate SoutakPlus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production site and security invariants
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            index.html content.html vercel.json robots.txt sitemap.xml ads.txt QA_CHECK.py \
            admin.html login.html privacy.html assets/js/admin.js assets/js/forms.js assets/js/app.js assets/js/reader-tools.js \
            supabase/functions/soutak-public-submit/index.ts supabase/functions/soutak-analytics/index.ts; do
            if [ ! -f "$f" ]; then echo "Missing required file: $f" >&2; exit 1; fi
          done

          # Core hosting/security headers and release gate must remain present.
          grep -Fq "script-src-attr 'none'" vercel.json || { echo 'CSP inline handler protection missing' >&2; exit 1; }
          grep -Fq 'Strict-Transport-Security' vercel.json || { echo 'HSTS missing' >&2; exit 1; }
          grep -Fq 'X-Frame-Options' vercel.json || { echo 'Clickjacking protection missing' >&2; exit 1; }
          grep -Fq 'no-store' vercel.json || { echo 'Sensitive-route no-store policy missing' >&2; exit 1; }
          grep -Fq "script-src 'self'" vercel.json || { echo 'Same-origin script policy missing' >&2; exit 1; }
          grep -Fq '"main": false' vercel.json || { echo 'Automatic main production deployment must remain disabled' >&2; exit 1; }

          # Public submission remains server-side and admin remains MFA/AAL2 protected.
          grep -Fq 'functions/v1/soutak-public-submit' assets/js/forms.js || { echo 'Hardened form submission route missing' >&2; exit 1; }
          if grep -Eq 'soutak_submit_(sponsor|service|contact)_.*public|soutak_subscribe_public' assets/js/forms.js; then
            echo 'Legacy direct public write RPC detected in forms.js' >&2; exit 1
          fi
          for marker in 'soutak_is_admin' 'aal2' '/factors/' 'challenge_id' '/token?grant_type=password'; do
            grep -Fq "$marker" assets/js/admin.js || { echo "Admin security invariant missing: $marker" >&2; exit 1; }
          done
          if grep -Eq 'cdn\.jsdelivr\.net|unpkg\.com|supabase-client\.js' login.html admin.html; then
            echo 'Admin/login must not depend on third-party SDK CDNs' >&2; exit 1
          fi

          # First-party analytics must remain minimal, source-restricted and reproducible.
          grep -Fq 'functions/v1/soutak-analytics' assets/js/app.js || { echo 'Operational analytics endpoint missing from app.js' >&2; exit 1; }
          grep -Fq 'navigator.globalPrivacyControl' assets/js/app.js || { echo 'GPC opt-out handling missing' >&2; exit 1; }
          grep -Fq 'navigator.doNotTrack' assets/js/app.js || { echo 'DNT opt-out handling missing' >&2; exit 1; }
          grep -Fq 'session_id: null' supabase/functions/soutak-analytics/index.ts || { echo 'Analytics must not store session IDs' >&2; exit 1; }
          grep -Fq 'forbidden_origin' supabase/functions/soutak-analytics/index.ts || { echo 'Analytics origin restriction missing' >&2; exit 1; }
          grep -Fq 'Privacy-minimal first-party operational analytics' assets/js/app.js || { echo 'Analytics privacy invariant comment missing' >&2; exit 1; }
          grep -Fq 'لا يستخدم هذا القياس Cookie أو localStorage أو معرف مستخدم أو معرف جلسة' privacy.html || { echo 'Privacy policy does not document minimal analytics' >&2; exit 1; }
          if grep -Eq 'headlineInput.*(fetch|send)|briefAudience.*(fetch|send)|briefProblem.*(fetch|send)|briefOutcome.*(fetch|send)|briefEvidence.*(fetch|send)' assets/js/reader-tools.js; then
            echo 'Content-lab input appears coupled to network transmission' >&2; exit 1
          fi

          # No production secrets or stale demo placeholders may be committed.
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          skip = {'.git'}
          secret_patterns = [
              re.compile(r'sb_secret_[A-Za-z0-9_-]{12,}'),
              re.compile(r'(?:SERVICE_ROLE_KEY|service_role_key)\s*[:=]\s*[\"\'][A-Za-z0-9._-]{20,}[\"\']'),
          ]
          placeholder = re.compile(r'YOUR-DOMAIN\.example|motshib-jpg\.github\.io/soutak-plus|وضع تجريبي|نسخة تجريبية')
          text_suffixes = {'.html','.js','.ts','.json','.md','.txt','.xml','.yml','.yaml','.py','.sql'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts) or p.suffix.lower() not in text_suffixes:
                  continue
              try:
                  s = p.read_text('utf-8')
              except Exception:
                  continue
              for pattern in secret_patterns:
                  if pattern.search(s):
                      print(f'Potential server secret committed in {p}', file=sys.stderr)
                      sys.exit(1)
              if p.suffix.lower() in {'.html','.js','.txt','.xml'} and placeholder.search(s):
                  print(f'Production placeholder/demo text found in {p}', file=sys.stderr)
                  sys.exit(1)
          PY

          python3 QA_CHECK.py
