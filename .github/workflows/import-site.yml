name: Validate SoutakPlus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production site and security invariants
        shell: bash
        run: |
          set -euo pipefail

          need_file() {
            if [ ! -f "$1" ]; then echo "Missing required file: $1" >&2; exit 1; fi
          }
          need_fixed() {
            if ! grep -Fq -- "$1" "$2"; then echo "Missing security invariant in $2: $3" >&2; exit 1; fi
          }
          need_regex() {
            if ! grep -Eq -- "$1" "$2"; then echo "Missing security invariant in $2: $3" >&2; exit 1; fi
          }

          for f in \
            index.html vercel.json robots.txt sitemap.xml account.html admin.html login.html \
            assets/js/account.js assets/js/admin.js assets/js/forms.js assets/js/reward-gate.js assets/js/rewarded-ads.js \
            supabase/functions/soutak-reward/index.ts supabase/functions/soutak-public-submit/index.ts; do
            need_file "$f"
          done

          for f in \
            downloads/creator-starter-guide.md \
            downloads/content-templates.md \
            downloads/first-audience-roadmap.md \
            database/schema.sql; do
            if [ -f "$f" ]; then echo "Forbidden production file present: $f" >&2; exit 1; fi
          done

          need_regex '"creator-starter-guide"[[:space:]]*:[[:space:]]*5' assets/js/store.js 'creator guide requires 5 rewards'
          need_regex '"content-templates"[[:space:]]*:[[:space:]]*5' assets/js/store.js 'templates require 5 rewards'
          need_regex '"first-audience"[[:space:]]*:[[:space:]]*10' assets/js/store.js 'first audience requires 10 rewards'
          need_fixed 'rewardedSlotGranted' assets/js/rewarded-ads.js 'reward is granted only from rewarded-slot event'
          need_fixed 'functions/v1/soutak-reward' assets/js/reward-gate.js 'reward access uses server Edge Function'
          if grep -Fq 'localStorage' assets/js/reward-gate.js; then
            echo 'Client-side entitlement detected in reward-gate.js' >&2; exit 1
          fi

          need_fixed 'functions/v1/soutak-public-submit' assets/js/forms.js 'forms use hardened submission Edge Function'
          if grep -Eq 'soutak_submit_(sponsor|service|contact)_.*public|soutak_subscribe_public' assets/js/forms.js; then
            echo 'Legacy direct public write RPC detected in forms.js' >&2; exit 1
          fi

          need_fixed 'soutak_is_admin' assets/js/admin.js 'admin authorization check'
          need_fixed 'aal2' assets/js/admin.js 'AAL2 requirement'
          need_fixed '/factors/' assets/js/admin.js 'MFA challenge and verify flow'
          need_fixed 'challenge_id' assets/js/admin.js 'MFA verification payload'
          need_fixed '/token?grant_type=password' assets/js/admin.js 'direct password sign-in'
          if grep -Eq 'cdn\.jsdelivr\.net|unpkg\.com|supabase-client\.js' login.html admin.html; then
            echo 'Admin/login must not depend on third-party SDK CDNs' >&2; exit 1
          fi

          need_fixed "script-src-attr 'none'" vercel.json 'inline event handlers blocked by CSP'
          need_fixed 'Strict-Transport-Security' vercel.json 'HSTS enabled'
          need_fixed 'X-Frame-Options' vercel.json 'clickjacking protection'
          need_fixed 'no-store' vercel.json 'sensitive routes not cached'
          need_fixed "script-src 'self'" vercel.json 'same-origin script policy available for sensitive routes'
          need_fixed 'Disallow: /admin.html' robots.txt 'admin blocked from crawlers'
          need_fixed 'Disallow: /login.html' robots.txt 'login blocked from crawlers'
          need_fixed 'Disallow: /account.html' robots.txt 'account blocked from crawlers'
          need_fixed 'Disallow: /product.html' robots.txt 'gated product route blocked from crawlers'
          need_fixed 'https://soutak-plus.vercel.app/sitemap.xml' robots.txt 'production sitemap declared'
          need_fixed 'https://soutak-plus.vercel.app/' sitemap.xml 'production URLs in sitemap'

          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          skip = {'.git'}
          secret_patterns = [
              re.compile(r'sb_secret_[A-Za-z0-9_-]{12,}'),
              re.compile(r'(?:SERVICE_ROLE_KEY|service_role_key)\s*[:=]\s*[\"\'][A-Za-z0-9._-]{20,}[\"\']'),
          ]
          placeholder = re.compile(r'YOUR-DOMAIN\.example|motshib-jpg\.github\.io/soutak-plus|وضع تجريبي|نسخة تجريبية')
          text_suffixes = {'.html','.js','.ts','.json','.md','.txt','.xml','.yml','.yaml','.py','.sql'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts) or p.suffix.lower() not in text_suffixes:
                  continue
              try:
                  s=p.read_text('utf-8')
              except Exception:
                  continue
              for pattern in secret_patterns:
                  if pattern.search(s):
                      print(f'Potential server secret committed in {p}', file=sys.stderr)
                      sys.exit(1)
              if p.suffix.lower() in {'.html','.js','.txt','.xml'} and placeholder.search(s):
                  print(f'Production placeholder/demo text found in {p}', file=sys.stderr)
                  sys.exit(1)
          PY

          python3 QA_CHECK.py
