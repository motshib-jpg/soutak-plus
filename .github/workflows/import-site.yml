name: Deploy SoutakPlus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site and Rewarded Ads rules
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/reward-gate.js
          test -f assets/js/rewarded-ads.js
          test -f downloads/creator-starter-guide.md
          test -f downloads/content-templates.md
          test -f downloads/first-audience-roadmap.md
          grep -q 'reward_ads_required: 5' assets/js/demo-data.js
          test "$(grep -c 'reward_ads_required: 5' assets/js/demo-data.js)" -ge 2
          grep -q 'reward_ads_required: 10' assets/js/demo-data.js
          grep -q 'rewardedSlotGranted' assets/js/rewarded-ads.js
          python3 QA_CHECK.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
