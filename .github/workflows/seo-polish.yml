name: One-time SEO polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final SEO polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, struct, zlib

          ROOT = 'https://soutak-plus.vercel.app/'
          COVER = ROOT + 'assets/images/article-cover.png'
          LOGO = ROOT + 'assets/images/icon.svg'

          # Create a lightweight 1200x630 branded social/article image using only stdlib.
          w, h = 1200, 630
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  t = x / (w - 1)
                  u = y / (h - 1)
                  r = int(7 + 25*t + 8*u)
                  g = int(10 + 52*t + 20*u)
                  b = int(18 + 88*t + 32*u)
                  # subtle light area for depth
                  d = ((x-870)**2 + (y-180)**2) ** 0.5
                  glow = max(0, 1 - d/420)
                  r = min(255, int(r + 25*glow))
                  g = min(255, int(g + 42*glow))
                  b = min(255, int(b + 65*glow))
                  raw.extend((r,g,b))
          def chunk(tag, data):
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag+data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w,h,8,2,0,0,0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
          Path('assets/images/article-cover.png').write_bytes(png)

          def add_social_image(html, rel=''):
              if 'property="og:image"' not in html:
                  marker = '</head>'
                  tags = f'<meta property="og:image" content="{COVER}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{COVER}">'
                  html = html.replace(marker, tags + marker, 1)
              return html

          # Upgrade Article JSON-LD in every article.
          for path in sorted(Path('articles').glob('*.html')):
              html = path.read_text(encoding='utf-8')
              html = add_social_image(html)
              scripts = list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>', html, flags=re.S))
              for m in reversed(scripts):
                  try:
                      data = json.loads(m.group(1))
                  except Exception:
                      continue
                  if data.get('@type') == 'Article':
                      data['image'] = {'@type':'ImageObject','url':COVER,'width':1200,'height':630}
                      for key in ('author','publisher'):
                          obj = data.get(key)
                          if isinstance(obj, dict) and obj.get('@type') == 'Organization':
                              obj['logo'] = {'@type':'ImageObject','url':LOGO}
                      new = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(',',':')) + '</script>'
                      html = html[:m.start()] + new + html[m.end():]
              # Keep SERP titles concise on the two overlong pages.
              if path.name == 'youtube-channel-without-showing-face.html':
                  html = re.sub(r'<title>.*?</title>', '<title>قناة يوتيوب بدون ظهور: دليل عملي | صوتك+</title>', html, count=1, flags=re.S)
              if path.name == 'seo-for-arabic-content-beginners.html':
                  html = re.sub(r'<title>.*?</title>', '<title>SEO للمحتوى العربي للمبتدئين: دليل عملي | صوتك+</title>', html, count=1, flags=re.S)
              path.write_text(html, encoding='utf-8')

          page_titles = {
              'content.html': 'مكتبة المقالات والأدلة لصنّاع المحتوى | صوتك+',
              'services.html': 'خدمات صناعة المحتوى والحضور الرقمي | صوتك+',
              'sponsors.html': 'التعاون والرعاية مع صوتك+ | شراكات واضحة',
              'contact.html': 'تواصل مع فريق صوتك+ | ملاحظات وتصحيحات',
              'terms.html': 'الشروط والأحكام لاستخدام منصة صوتك+',
          }
          page_types = {
              'about.html': 'AboutPage',
              'editorial.html': 'WebPage',
              'services.html': 'WebPage',
              'sponsors.html': 'WebPage',
              'contact.html': 'ContactPage',
              'privacy.html': 'WebPage',
              'terms.html': 'WebPage',
          }
          page_names = {
              'about.html':'عن صوتك+', 'editorial.html':'السياسة التحريرية والشفافية', 'services.html':'خدمات صوتك+',
              'sponsors.html':'التعاون والرعاية', 'contact.html':'التواصل مع صوتك+', 'privacy.html':'سياسة الخصوصية والإعلانات',
              'terms.html':'الشروط والأحكام'
          }
          for fname, ptype in page_types.items():
              p = Path(fname); html = p.read_text(encoding='utf-8')
              if fname in page_titles:
                  html = re.sub(r'<title>.*?</title>', f'<title>{page_titles[fname]}</title>', html, count=1, flags=re.S)
              html = add_social_image(html)
              if '"@type":"'+ptype+'"' not in html and f'"@type": "{ptype}"' not in html:
                  schema = {
                      '@context':'https://schema.org','@type':ptype,'name':page_names[fname],
                      'url':ROOT + fname,'inLanguage':'ar',
                      'isPartOf':{'@type':'WebSite','name':'صوتك+','url':ROOT},
                      'publisher':{'@type':'Organization','name':'صوتك+','url':ROOT,'logo':{'@type':'ImageObject','url':LOGO}}
                  }
                  tag = '<script type="application/ld+json">'+json.dumps(schema,ensure_ascii=False,separators=(',',':'))+'</script>'
                  html = html.replace('</head>', tag+'</head>', 1)
              p.write_text(html, encoding='utf-8')

          # Content index title and social image.
          p = Path('content.html'); html = p.read_text(encoding='utf-8')
          html = re.sub(r'<title>.*?</title>', f'<title>{page_titles["content.html"]}</title>', html, count=1, flags=re.S)
          html = add_social_image(html); p.write_text(html, encoding='utf-8')

          # Add useful, visible explanatory sections to pages previously flagged as thin.
          additions = {
          'services.html': '''<section class="section soft"><div class="container"><div class="section-head"><span>كيف نعمل؟</span><h2>خدمة تبدأ من هدف واضح وتنتهي بمخرجات قابلة للمراجعة</h2></div><div class="grid3"><article class="card"><h3>قبل الطلب</h3><p>حدد المنصة والجمهور والهدف والمادة المتاحة لديك. كلما كان السياق أوضح كان نطاق العمل أدق، ولا نعد بنتائج مضمونة مثل عدد محدد من المشاهدات أو المبيعات.</p></article><article class="card"><h3>أثناء التنفيذ</h3><p>نحوّل المطلوب إلى نطاق واضح ومخرجات يمكن مراجعتها. أي معلومات أو أرقام حساسة تحتاج مصدرًا أو توضيحًا، ونفصل بين الرأي والمعلومة التي يمكن التحقق منها.</p></article><article class="card"><h3>بعد التسليم</h3><p>تحصل على مخرجات قابلة للاستخدام مع توضيح ما تم إنجازه وما يحتاج قرارًا منك. بيانات الطلب تستخدم لمعالجة الطلب فقط وفق سياسة الخصوصية.</p></article></div></div></section>''',
          'sponsors.html': '''<section class="section soft"><div class="container"><div class="section-head"><span>معايير التعاون</span><h2>نفضّل الشراكة المفهومة للقارئ والمناسبة له</h2></div><div class="grid3"><article class="card"><h3>الملاءمة أولًا</h3><p>نراجع مدى صلة المنتج أو الخدمة بجمهور صناعة المحتوى والحضور الرقمي. وجود ميزانية وحده لا يعني قبول التعاون إذا لم تكن هناك فائدة واضحة للجمهور.</p></article><article class="card"><h3>إفصاح واضح</h3><p>أي تعاون تجاري يتم توضيحه للقارئ بطريقة مناسبة، ولا يمنح المعلن حق التحكم بالمحتوى التحريري المستقل أو تغيير رأي تحريري مقابل المقابل المالي.</p></article><article class="card"><h3>معلومات الطلب</h3><p>من المفيد ذكر الجهة، الهدف، نوع التعاون، المدة، السوق المستهدف وأي متطلبات أساسية. نستخدم البيانات المرسلة لتقييم الطلب والتواصل بشأنه فقط.</p></article></div></div></section>''',
          'contact.html': '''<section class="section soft"><div class="container"><div class="section-head"><span>متى تستخدم هذه الصفحة؟</span><h2>التواصل مخصص للملاحظات والتصحيحات والاستفسارات الواضحة</h2></div><div class="grid3"><article class="card"><h3>تصحيح محتوى</h3><p>إذا وجدت رقمًا أو تاريخًا أو رابطًا أو معلومة تحتاج مراجعة، اذكر الصفحة والجزء المقصود وما يدعم التصحيح. نراجع الملاحظات التحريرية وفق سياسة التصحيح المنشورة.</p></article><article class="card"><h3>استفسار عام</h3><p>اكتب سؤالك باختصار مع السياق الضروري. لا تحتاج إلى إنشاء حساب لإرسال رسالة، ولا نطلب كلمات مرور أو بيانات دفع عبر نموذج التواصل.</p></article><article class="card"><h3>خصوصيتك</h3><p>أرسل فقط البيانات اللازمة للرد على رسالتك. تستخدم بيانات النموذج لمعالجة التواصل وفق سياسة الخصوصية، ولا تُعرض رسالتك للعامة تلقائيًا.</p></article></div></div></section>'''
          }
          for fname, section in additions.items():
              p=Path(fname); html=p.read_text(encoding='utf-8')
              marker='</main>'
              if section not in html:
                  html=html.replace(marker, section+marker, 1)
              p.write_text(html, encoding='utf-8')

          # Add a social image to the homepage too.
          p=Path('index.html'); html=add_social_image(p.read_text(encoding='utf-8')); p.write_text(html,encoding='utf-8')

          # Refresh service worker cache version so returning users see the polish immediately.
          p=Path('sw.js'); sw=p.read_text(encoding='utf-8').replace('soutakplus-v12-adsense-ready','soutakplus-v13-seo-polish'); p.write_text(sw,encoding='utf-8')

          # Remove this one-time bootstrap workflow from the final production commit.
          Path('.github/workflows/seo-polish.yml').unlink(missing_ok=True)
          PY

          git config user.name "soutak-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish structured data, social metadata, titles and thin pages"
            git push origin HEAD:main
          fi
