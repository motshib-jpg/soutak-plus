name: Contextual Link Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contextual-link-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add contextual inbound-link invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('QA_CHECK.py')
          s=p.read_text('utf-8')
          marker="for article in article_pages:\n    if f'articles/{article.name}' not in content_html:\n        errors.append(f\"{article.name}: missing link from content.html\")\n"
          addition=marker+'''\n# Every article also needs a contextual inbound link outside the hub itself.\ncontext_sources = [root / "index.html", root / "editorial.html", *article_pages]\nfor article in article_pages:\n    needles = [f'href="{article.name}"', f'href="articles/{article.name}"', f'href="../articles/{article.name}"']\n    inbound = 0\n    for source in context_sources:\n        if source == article:\n            continue\n        text = source.read_text(encoding="utf-8")\n        if any(n in text for n in needles):\n            inbound += 1\n    if inbound < 1:\n        errors.append(f"{article.name}: no contextual inbound link outside content.html")\n'''
          if 'no contextual inbound link outside content.html' not in s:
              if marker not in s:
                  raise SystemExit('insertion marker not found')
              s=s.replace(marker, addition, 1)
              p.write_text(s,'utf-8')
          PY
          python3 QA_CHECK.py
      - name: Commit guard and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soutak-plus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add QA_CHECK.py
          git rm .github/workflows/contextual-link-guard.yml
          git commit -m "Require contextual inbound links for every article"
          git push
